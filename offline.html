<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Offline — Evidencia receptov</title>
<!-- Stránka zo sw.js pre prípad, keď niet internetu a v zariadení nie je
     uložená kópia receptov (napr. po odhlásení), alebo pre stránky, ktoré
     bez servera nefungujú (prihlásenie, správa používateľov). -->
<style>
  html,body{min-height:100%;margin:0;}
  body{display:flex;align-items:center;justify-content:center;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:#f7f7f5;color:#1a160f;text-align:center;padding:24px;box-sizing:border-box;min-height:100vh;}
  .wrap{max-width:400px;}
  .emoji{font-size:56px;margin-bottom:12px;}
  h1{font-size:24px;margin:0 0 12px;}
  p{color:#5c564c;font-size:17px;line-height:1.55;margin:0 0 16px;}
  .tlacidla{display:flex;flex-direction:column;gap:12px;margin-top:24px;}
  button,a.tlacidlo{display:block;box-sizing:border-box;width:100%;min-height:52px;border-radius:12px;
    padding:14px 20px;font-size:18px;font-weight:600;cursor:pointer;text-decoration:none;font-family:inherit;}
  button{background:#f59e0b;color:#1a160f;border:none;}
  a.tlacidlo{background:transparent;color:#92400e;border:2px solid #f59e0b;}
  @media (prefers-color-scheme: dark){
    body{background:#0f1115;color:#f1f5f9;}
    p{color:#a8a29e;}
    a.tlacidlo{color:#fbbf24;}
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="emoji">📡</div>
    <h1>Si offline</h1>
    <p>Táto stránka potrebuje pripojenie na internet. Skontroluj Wi-Fi alebo mobilné dáta a skús to znova.</p>
    <p>Recepty sa dajú pozerať aj bez internetu, ale len ak bola appka na tomto zariadení predtým aspoň raz otvorená s internetom a s prihlásením.</p>
    <div class="tlacidla">
      <button type="button" onclick="location.reload()">Skúsiť znova</button>
      <a class="tlacidlo" href="./index.php" id="odkazRecepty">Otvoriť recepty</a>
    </div>
  </div>
  <script>
    // Stránku vracia sw.js aj na iných adresách (napr. admin/…), preto odkaz
    // na recepty skladáme od adresy service workera, ktorý je v koreni appky.
    (function () {
      var sw = navigator.serviceWorker && navigator.serviceWorker.controller;
      if (sw) document.getElementById('odkazRecepty').href = new URL('index.php', sw.scriptURL).href;
    })();
  </script>
</body>
</html>
