<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Offline — Evidencia receptov</title>
<style>
  html,body{height:100%;margin:0;display:flex;align-items:center;justify-content:center;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:#f7f7f5;color:#1a160f;text-align:center;padding:24px;box-sizing:border-box;}
  .wrap{max-width:360px;}
  .emoji{font-size:48px;margin-bottom:12px;}
  h1{font-size:20px;margin:0 0 8px;}
  p{color:#6b6458;font-size:15px;line-height:1.5;margin:0 0 20px;}
  button{background:#f59e0b;color:#1a160f;border:none;border-radius:10px;padding:12px 20px;
    font-size:15px;font-weight:600;cursor:pointer;}
</style>
</head>
<body>
  <div class="wrap">
    <div class="emoji">📡</div>
    <h1>Si offline</h1>
    <p>Na pridávanie a úpravu receptov je potrebné pripojenie na internet. Skontroluj Wi-Fi alebo mobilné dáta a skús to znova.</p>
    <button onclick="location.reload()">Skúsiť znova</button>
  </div>
</body>
</html>
