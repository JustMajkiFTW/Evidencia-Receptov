; Nastavenie PHP pre lokálny Docker (Evidencia receptov).
date.timezone = Europe/Bratislava

; Fotky receptov a kuchárky v PDF (Správa → Kuchárky)
upload_max_filesize = 100M
post_max_size = 100M
memory_limit = 512M
max_execution_time = 180

; Chyby nevypisuje PHP, ale appka sama (APP_DEBUG=1 v docker-compose.yml)
display_errors = Off
log_errors = On
error_log = /dev/stderr
