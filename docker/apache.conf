# Apache pre lokálny Docker (Evidencia receptov).
ServerName localhost

# V Dockeri je pripojený celý priečinok projektu. Na server sa tieto časti
# nenahrávajú, tak ich nevydáme ani tu.
<DirectoryMatch "^/var/www/html/(\.git|\.github|\.claude|\.idea|docker|sql|testy|vendor)(/|$)">
    Require all denied
</DirectoryMatch>
<FilesMatch "^(\.env.*|docker-compose\.yml|composer\.(json|lock))$">
    Require all denied
</FilesMatch>

# Stav testovacej appky na domácom serveri (zapisuje ho docker/homelab/aktualizator.sh):
# vždy čerstvý a s diakritikou.
<Files "nasadene.txt">
    ForceType "text/plain; charset=utf-8"
    Header set Cache-Control "no-store"
</Files>
